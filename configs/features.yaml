# Feature-extraction thresholds. Chosen ONCE, on 2026-09-20, before any model
# results existed. Do not tune these against results; see docs/NOTES.md.
#
# The choice rests on a physical/noise-floor argument, not on the data:
# positions are recorded to 1e-6 m, so at 30 Hz the measurement noise floor for
# speed is ~3e-5 m/s, and 1 mm/s is ~30x above it. A literature search found no
# published numeric threshold (TODO(verify): re-check if a source turns up).

# Speeds are in m/s.
moving_speed_threshold: 0.001      # below this the instrument counts as idle

# A "movement" is a run of consecutive frames at or above the threshold that
# lasts at least this long. Seconds.
# NOTE: movement count is NOT in the feature matrix (dropped 2026-09-20: threshold
# crossings chatter even after smoothing). count_movements() and this value are
# kept for a possible revisit; moving_speed_threshold is still used by idle.
min_movement_duration_s: 0.2

# Robustness check only, run on the final analysis. NOT extra features.
# Declared in advance: 0.5, 1 and 2 mm/s.
idle_threshold_grid: [0.0005, 0.001, 0.002]

# Spectral arc length (SPARC) smoothness, applied to the whole windowed trial's
# speed profile. These are the default settings in the authors' reference
# implementation (github.com/siva82kb/SPARC, scripts/smoothness.py:
# sparc(movement, fs, padlevel=4, fc=10.0, amp_th=0.05)), verified 2026-09-20.
# TODO(verify): the paper citation itself (that file's docstring cites none).
# NOTE: SPARC is DROPPED from the primary feature set (decision 2026-09-20); see
# docs/NOTES.md. These settings are kept for a later per-movement revisit.
sparc_cutoff_hz: 10.0        # ignore spectrum above this frequency
sparc_amp_threshold: 0.05    # trim the spectrum's tail below this fraction of its peak
sparc_padlevel: 4            # zero-pad the FFT to 2**(ceil(log2 n) + this) points

# Gripper open/close cycles, hysteresis band on the gripper angle (units
# unverified, values look like radians; TODO(verify)). The band sits in the sparse
# gap between the two humps of the pooled PSM1 angle distribution (a label-free
# look on 2026-09-20). It holds 6.7% of PSM1 frames and 18.4% of PSM2 frames;
# PSM2's distribution has no clean gap, so its count is the less trustworthy one.
gripper_low_threshold: -0.6
gripper_high_threshold: -0.1

# Position smoothing, applied ONCE to the tool-tip positions before every derived
# feature (path length, speed, acceleration, idle, movements, volume,
# coordination). Decided 2026-09-20. The gripper angle is not smoothed.
#
# Zero-phase Butterworth low-pass: run forward then backward (scipy filtfilt) so
# it adds no time shift. Second order per pass, so effectively fourth order.
# Because it runs twice, the gain at the cutoff is 0.5 (-6 dB), not 0.707.
#
# Why 5 Hz: it sits below the 8-12 Hz physiological-tremor band, above the
# low-frequency content of voluntary movement, and at the low end of the 5-10 Hz
# range used in surgical-tracking practice. The evidence pins a range of roughly
# 3-8 Hz, not one number, so the exact value is a judgment call. No JIGSAWS-
# specific value was found. TODO(verify): re-check if a source turns up.
smoothing_cutoff_hz: 5.0     # null would mean "no smoothing" (raw)
smoothing_order: 2

# Robustness check, declared in advance: repeat the final analysis with raw
# positions (null) and at 8 Hz. NOT extra features.
smoothing_sensitivity_cutoffs_hz: [null, 8.0]
