# Feature-extraction thresholds. Chosen ONCE, on 2026-09-20, before any model
# results existed. Do not tune these against results; see docs/NOTES.md.
#
# The choice rests on a physical/noise-floor argument, not on the data:
# positions are recorded to 1e-6 m, so at 30 Hz the measurement noise floor for
# speed is ~3e-5 m/s, and 1 mm/s is ~30x above it. A literature search found no
# published numeric threshold (TODO(verify): re-check if a source turns up).

# Speeds are in m/s.
moving_speed_threshold: 0.001      # below this the instrument counts as idle

# A "movement" is a run of consecutive frames at or above the threshold that
# lasts at least this long. Seconds.
min_movement_duration_s: 0.2

# Robustness check only, run on the final analysis. NOT extra features.
# Declared in advance: 0.5, 1 and 2 mm/s.
idle_threshold_grid: [0.0005, 0.001, 0.002]

# Spectral arc length (SPARC) smoothness, applied to the whole windowed trial's
# speed profile. Settings are the published defaults as remembered from the
# original paper's reference implementation (Balasubramanian et al. 2015).
# TODO(verify): confirm these three values against the paper before the write-up.
sparc_cutoff_hz: 10.0        # ignore spectrum above this frequency
sparc_amp_threshold: 0.05    # trim the spectrum's tail below this fraction of its peak
sparc_padlevel: 4            # zero-pad the FFT to 2**(ceil(log2 n) + this) points

# Gripper open/close cycles, hysteresis band on the gripper angle (units
# unverified, values look like radians; TODO(verify)). The band sits in the sparse
# gap between the two humps of the pooled PSM1 angle distribution (a label-free
# look on 2026-09-20). It holds 6.7% of PSM1 frames and 18.4% of PSM2 frames;
# PSM2's distribution has no clean gap, so its count is the less trustworthy one.
gripper_low_threshold: -0.6
gripper_high_threshold: -0.1
